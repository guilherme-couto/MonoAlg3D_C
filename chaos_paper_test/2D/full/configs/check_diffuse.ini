[main]
num_threads = 12
dt_pde = 0.020000
simulation_time = 1000.000000
abort_on_no_activity = 1
use_adaptivity = 0

[ode_solver]
dt = 0.020000
use_gpu = 1
gpu_id = 0
library_file = shared_libs/libten_tusscher_3_epi.so

[stim_s1]
main_function = stim_if_x_less_than
library_file = ./shared_libs/libdefault_stimuli.so
start = 0.0
duration = 2.0
current = -38.0
x_limit = 500.0

[domain]
main_function = initialize_grid_with_custom_mesh_with_fibrosis_fiber_and_border_zone
library_file = ./shared_libs/libdefault_domains.so
name = diffuse angle=0 den=0.45 seed=1996516809 atpi=2.0
mesh_file = chaos_paper/2D/full/alg_meshes/diffuse/diffuse_angle0_density0.45_seed1996516809.alg
num_volumes = 160000
original_discretization = 100.0
num_extra_fields = 6
start_dx = 100.000000
start_dy = 100.000000
start_dz = 100.000000

[assembly_matrix]
main_function = anisotropic_sigma_assembly_matrix
init_function = set_initial_conditions_fvm
library_file = ./shared_libs/libdefault_matrix_assembly.so
sigma_l = 0.0001334
sigma_t = 0.0000176
sigma_n = 0.0000176
fibers_in_mesh = true

[update_monodomain]
main_function = update_monodomain_default
library_file = ./shared_libs/libdefault_update_monodomain.so

[linear_system_solver]
main_function = conjugate_gradient
init_function = init_conjugate_gradient
end_function = end_conjugate_gradient
tolerance = 1e-9
use_preconditioner = no
max_iterations = 200
use_gpu = true

[extra_data]
main_function = set_extra_data_for_hypoxia_with_border_zone_multiplier_from_mesh
library_file = ./shared_libs/libdefault_extra_data.so
atpi = 2.0

[save_result]
main_function = save_as_ensight
library_file = ./shared_libs/libdefault_save_mesh.so
print_rate = 5000
output_dir = chaos_paper/2D/full/outputs/atpi2.0/diffuse_angle0/den0.45_seed1996516809
add_timestamp = false
binary = true
remove_older_simulation = true

[calc_ecg]
main_function = pseudo_bidomain
init_function = init_pseudo_bidomain
end_function = end_pseudo_bidomain
library_file = ./shared_libs/libdefault_calc_ecg.so
calc_rate = 10
lead1 = -5000,20000,50
lead2 = 45000,20000,50
sigma_b = 20
use_gpu = true
filename = chaos_paper/2D/full/outputs/atpi2.0/diffuse_angle0/den0.45_seed1996516809/ecg.txt
